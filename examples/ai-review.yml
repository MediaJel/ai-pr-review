# Caller template — copy this file into your repo at
# .github/workflows/ai-review.yml
#
# Triggers on PR open, new pushes (synchronize), draft -> ready, and reopen;
# skips drafts. Review logic lives centrally — update it once in
# MediaJel/ai-pr-review and every repo picks it up.
#
# For maximum supply-chain safety, pin `uses:` to a full commit SHA instead
# of the floating major tag, e.g.:
#   uses: MediaJel/ai-pr-review/.github/workflows/pr-review.yml@<commit-sha> # v1.0.0

name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

# NOTE: do not add a concurrency block here — the reusable workflow has one
# centrally, and a caller-side group with the same name deadlocks the run.

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: MediaJel/ai-pr-review/.github/workflows/pr-review.yml@v1
    secrets: inherit
