# Dogfooding: this repo reviews its own PRs with the workflow it ships.
# Visitors can see a live demo on any open PR.

name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    # Pinned to a full commit SHA (= v1.0.0) — tags are movable, SHAs are not.
    uses: MediaJel/ai-pr-review/.github/workflows/pr-review.yml@14ec37c3f59f9d8a0843b86cc67ff9a8e7367ad0
    secrets: inherit
